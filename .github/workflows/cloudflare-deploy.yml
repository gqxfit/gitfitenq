name: Deploy free Cloudflare portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build public assets
        run: node scripts/build-cloudflare.mjs
      - name: Deploy Worker using restricted token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '74df9af086f6280657a860193282fa4b'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Add the restricted Cloudflare token as the CLOUDFLARE_API_TOKEN repository Actions secret, then run this workflow again."
            exit 1
          fi
          npx --yes wrangler@4 deploy
